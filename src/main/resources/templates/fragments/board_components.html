<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<main id="userMain" class="container my-4">
	
	<div th:fragment="boardMain(taskBtnText, reportBtnText)" class="row g-4">
		
		<!-- タスク状況 -->
		<section class="col-lg-6">
			<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
				<h4 class="fw-bold text-secondary mb-0">今日のタスク状況</h4>
				<a th:href="@{/tasks}" class="btn btn-outline-secondary btn-sm" th:text="${taskBtnText}">〇〇一覧へ</a>
			</div>
			
			<!-- ステータス別件数 -->
			<div class="list-group shadow">
				<a th:href="@{/tasks(status=${STATUS.TODO})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-4">
					<span class="fs-5 fw-bold text-muted">未着手</span>
					<span th:text="|${taskCounts[STATUS.TODO]}件|" class="badge bg-secondary fs-5 px-3 rounded-pill">00件</span>
				</a>
				<a th:href="@{/tasks(status=${STATUS.DOING})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-4">
					<span class="fs-5 fw-bold text-primary">進行中</span>
					<span th:text="|${taskCounts[STATUS.DOING]}件|" class="badge bg-secondary fs-5 px-3 rounded-pill">00件</span>
				</a>
				<a th:href="@{/tasks(status=${STATUS.DONE})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-4">
					<span class="fs-5 fw-bold text-success">完了済</span>
					<span th:text="|${taskCounts[STATUS.DONE]}件|" class="badge bg-secondary fs-5 px-3 rounded-pill">00件</span>
				</a>
			</div>
		</section>

		<!-- 直近３件の日報 -->
		<section class="col-lg-6">
			<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
				<h4 class="fw-bold text-secondary m-0">直近３件の日報</h4>
				<a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm" th:text="${reportBtnText}">〇〇一覧へ</a>
			</div>
			
			<!-- 日報が1件もない場合の表示 -->
			<div th:if="${#lists.isEmpty(recentReports)}" class="text-center text-muted p-4 bg-white rounded border shadow-sm">
				<i class="bi bi-journal-x fs-1 text-black-50 mb-3 d-block"></i>
				<p class="m-0">提出された日報はありません</p>
			</div>
			
			<!-- 日報がカラじゃなければ<a>からループ開始 -->
			<div th:if="${!#lists.isEmpty(recentReports)}" class="list-group shadow">
				
				<a th:each="reportDto : ${recentReports}" th:href="@{/reports/{id}(id=${reportDto.id})}" class="list-group-item list-group-item-action p-3">
					<div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
						<!-- 日付 -->
						<span class="text-primary fw-bold small text-nowrap" th:text="${reportDto.reportDate}">2026/07/24(金)</span>
						
						<!-- コメントが1件以上ある場合のみフィードバックエリアを表示 -->
						<div th:if="${reportDto.commentCount > 0}" class="d-flex align-items-center text-nowrap ms-2">
							<span th:if="${reportDto.unRead}" class="badge bg-danger" style="font-size: 0.65rem; padding: 0.2em 0.5em;">未読あり</span>
							<span class="text-secondary small d-flex align-items-center ms-2">
								<i class="bi bi-chat-left-text-fill text-success me-1"></i>
								<span th:text="${reportDto.commentCount}">1</span>件
							</span>
						</div>
					</div>
					
					<p class="text-secondary small text-truncate m-0" th:text="${reportDto.content}">業務内容のあらすじがここに入ります。</p>
				</a>
				
			</div>
		</section>
		
	</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
