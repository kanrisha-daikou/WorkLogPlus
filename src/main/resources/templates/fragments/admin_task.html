<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<main id="userMain" class="container my-4">
	
	<div th:fragment="taskCard(task, textColor)" class="card shadow-sm p-3 mb-2" th:classappend="${task.status == 'DONE'} ? 'opacity-75' : ''">
		
		<!-- タップ出来る常駐エリア -->
		<div class="d-flex flex-column gap-2"
		data-bs-toggle="collapse" 
		th:data-bs-target="'#collapseTask' + ${task.id}" 
		role="button" 
		aria-expanded="false">
			<!-- 1行目：両端配置（名前 ---------------- 期限日） -->
			<div class="d-flex justify-content-between align-items-center gap-2">
				<!-- 名前バッジ -->
				<span class="badge bg-dark fw-bold text-truncate" style="font-size: 0.75rem;">
					<i class="bi bi-person-fill me-1"></i>
					<span th:text="${task.username}">名前</span>
				</span>
				<!-- 期限日 -->
				<span class="small text-nowrap " th:classappend="${textColor}">期限：
					<span th:text="${task.dueDate == ''} ? '未設定' : ${task.dueDate}">2026/08/30</span>
				</span>
			</div>
			<!-- 2行目：タスクタイトルの冒頭 -->
			<h6 class="fw-bold m-0 text-truncate" th:text="${task.title}">タスクのタイトル</h6>
		</div>

		<!-- 【アコーディオンの中身】ふだんは非表示、タップで下に開く -->
		<div class="collapse" th:id="'collapseTask' + ${task.id}">
			<div class="border-top mt-3 pt-2 small text-muted">
				<p class="mb-2" style="font-size: 0.75rem;">
					<i class="bi bi-person-fill me-1"></i>
					<span class="text-dark" th:text="${task.username + ' さん'}">フルネーム</span>
				</p>
				
				<p class="text-dark bg-light p-2 rounded mb-0" style="white-space: pre-wrap;" th:text="${task.title}">タスクのタイトル全文</p>
			</div>
		</div>
		
	</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
