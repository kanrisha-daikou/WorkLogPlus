<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

	<!-- 画面上部ナビメニュー -->
	<nav th:fragment="navMenu" class="navbar navbar-expand-lg navbar-dark bg-dark shadow mb-4">
		<div class="container">
			<a th:href="@{/}" class="navbar-brand">WorkLogPlus</a>
			<button class="navbar-toggler" type="button" 
			data-bs-toggle="collapse" 
			data-bs-target="#nav" 
			aria-controls="nav" 
			aria-expanded="false" 
			aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a th:href="@{/}" class="nav-link text-nowrap">ダッシュボード</a></li>
					<li class="nav-item"><a th:href="@{/tasks}" class="nav-link text-nowrap">タスク管理(一覧)</a></li>
					<li class="nav-item"><a th:href="@{/reports}" class="nav-link text-nowrap">日報管理(一覧)</a></li>
					<li class="nav-item"><a th:href="@{/reports/new}" class="nav-link text-nowrap">日報作成</a></li>
					<li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link dropdown-toggle text-warning fw-bold" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<i class="bi bi-shield-lock-fill me-1"></i>管理者メニュー
						</a>
						<ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="adminDropdown">
							<li><a class="dropdown-item" th:href="@{/admin/reports}">全ユーザ日報一覧</a></li>
							<li><a class="dropdown-item" th:href="@{/tasks/admin}">全ユーザタスク一覧</a></li>
							<!-- 今後、ユーザー管理などを増やす場合はここに追加できます -->
							<!-- <li><a class="dropdown-item" th:href="@{/admin/users}">ユーザー管理</a></li> -->
						</ul>
					</li>
				</ul>
				
				<div class="nav-item dropdown ms-auto">
					<a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
						<i class="bi bi-person-circle me-1"></i>
						<span sec:authentication="principal.user.username" class="d-inline-block text-truncate align-bottom" style="max-width: 300px;">ユーザー名</span>
						<span>さん</span>
					</a>
					<ul class="dropdown-menu dropdown-menu-dark px-3" style="min-width: auto;">
						<li>
							<form th:action="@{/logout}" method="post" class="m-0">
								<button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
							</form>
						</li>
					</ul>
				</div>
			</div>
		</div>
		
		<!-- ナビメニューの外をタップすると閉じてくれる -->
		<script th:src="@{/js/nav.js}"></script>
	</nav>
	
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
