<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLogPlus admin-reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	<div th:replace="~{fragments/layout :: navMenu}"></div>
	
	<main class="container py-4">
	
		<!-- ヘッダー -->
		<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2 flex-wrap gap-2">
			<h2 class="fw-bold text-dark mb-0">
				<i class="bi bi-file-earmark-text text-danger me-2"></i><span th:text="${reportDto.isOwn} ? '日報の詳細' : '日報詳細（フィードバック）'">日報詳細</span>
			</h2>
			<a th:href="@{/admin/reports}" class="btn btn-outline-secondary btn-sm">
				<i class="bi bi-arrow-left me-1"></i>日報一覧へ
			</a>
		</div>
		
		<!-- 成功メッセージエリア -->
		<div th:if="${okMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i>
			<span th:text="${okMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		
		<!-- 入力エラーが起きた時の赤い警告ボックス -->
		<div th:if="${#fields.hasErrors('commentForm.*')}" class="alert alert-danger shadow-sm mb-4 fw-bold" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i>
			<span>入力内容にエラーがあります</span>
		</div>
	
		<!-- 日報の基本情報カード（提出者・日付） -->
		<div class="card shadow-sm">
			<div class="card-body gap-2 px-4 d-flex flex-wrap align-items-center justify-content-between">
				<div th:if="${!reportDto.isOwn}" class="d-flex align-items-center">
					<span class="text-muted small me-1 text-nowrap">提出者：</span>
					<span class="fs-5 fw-bold text-dark" th:text="${reportDto.username}">山田 太郎</span>
				</div>
				<div class="d-flex align-items-center">
					<span class="text-muted small me-1 text-nowrap">対象日：</span>
					<span class="fs-5 fw-bold text-primary" th:text="${reportDto.reportDate}">2026/07/24(金)</span>
				</div>
				<!-- 「編集する」ボタン -->
				<a th:if="${reportDto.isOwn}" th:href="@{/admin/reports/{id}/edit(id=${reportDto.id})}" class="btn btn-warning btn-sm">
					<i class="bi bi-pencil-square me-1"></i>編集する
				</a>
			</div>
		</div>
		
		<!-- 日報詳細本文カード -->
		<div th:replace="~{fragments/report_detail :: detailCard}"></div>
		
		<!-- C. 💬 フィードバック入力カード -->
		<div th:if="${!#lists.isEmpty(comments) || !reportDto.isOwn}" class="card border-warning shadow-sm">
			<div class="card-body p-4">
				<h5 class="fw-bold text-dark mb-4">
					<i class="bi bi-chat-left-dots-fill text-danger me-2"></i>この日報へのフィードバック
				</h5>

				<!-- 過去のコメント履歴（チャット風） -->
				<div th:if="${!#lists.isEmpty(comments)}" class="p-3 d-grid gap-3 bg-light rounded mb-4 border-start border-4 border-success shadow-sm">
					<div class="rounded bg-white p-2" th:each="comment : ${comments}">
						
						<div class="d-flex justify-content-between small text-muted mb-2">
							<div>
								<span class="fw-bold me-2" th:text="${comment.adminName}">管理者（あなた）</span>
								<span th:text="${comment.createdAt}">2026/08/04 12:00</span>
							</div>
							<!-- 削除ボタン -->
							<form th:if="${comment.isOwn}"
							 th:action="@{/admin/reports/{reportId}/delete-comment/{commentId}(reportId=${reportDto.id}, commentId=${comment.id})}" 
							 method="post" class="m-0">
								<button type="submit" class="btn btn-link text-danger p-0 border-0 lh-1" onclick="return confirm('このフィードバックを削除してもよろしいですか？');">
									<i class="bi bi-trash3 me-1"></i>
								</button>
							</form>
							
						</div>
						<p class="small text-secondary mb-0" th:text="${comment.body}" style="white-space: pre-wrap;">前回のフィードバック内容がここに残ります。</p>
						
					</div>
				</div>

				<!-- コメント入力フォーム -->
				<form th:if="${!reportDto.isOwn}" th:action="@{/admin/reports/{id}/save-comment(id=${reportDto.id})}" th:object="${commentForm}" method="post">
					<div class="mb-3">
						<label for="body" class="form-label small fw-bold text-secondary">フィードバックを入力</label>
						<textarea th:field="*{body}" class="form-control shadow-sm" rows="4" placeholder="アドバイスやコメントを記入してください（1000文字以内）" required></textarea>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
					</div>
					<div class="text-end">
						<button type="submit" class="btn btn-danger fw-bold px-4 shadow-sm">
							<i class="bi bi-send-fill me-2"></i>フィードバックを送信する
						</button>
					</div>
				</form>
				
			</div>
		</div>
		
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
