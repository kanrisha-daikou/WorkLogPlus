<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="_csrf" th:content="${_csrf.token}"><!-- Spring Security 用の合言葉 -->
<meta name="_csrf_header" th:content="${_csrf.headerName}"><!-- Spring Security 用の合言葉 -->
<title>WorkLogPlus - tasks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	<div th:replace="~{fragments/layout :: navMenu}"></div>
	
	<main id="userMain" class="container my-4">
		
		<!-- トーストを表示するコンテナ（画面の右上に固定） -->
		<div class="toast-container position-fixed top-0 p-3" style="z-index: 1055;">
			<div id="successToast" 
			class="toast fade align-items-center text-white bg-success rounded-pill shadow" 
			style="width: max-content;" 
			role="alert" 
			aria-live="assertive" 
			aria-atomic="true">
				<div class="toast-body fw-bold px-3 py-2">
					<i class="bi bi-check-circle-fill me-2"></i>
					<span id="toastMessage">○○を更新しました</span>
				</div>
			</div>
		</div>
		
		
		
		<!-- ================= ページヘッダー ================= -->
		<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom gap-2">
			<h2 class="fw-bold text-dark m-0"><i class="bi bi-kanban text-primary me-2"></i>タスク管理(一覧)</h2>
			
			<button sec:authorize="hasRole('GENERAL')" class="btn btn-primary btn-sm fw-bold px-3 text-nowrap" data-bs-toggle="modal" data-bs-target="#addTaskModal">タスク追加</button>
			
			<div sec:authorize="hasRole('ADMIN')" class="d-flex flex-wrap gap-2 flex-grow-1 flex-sm-grow-0">
				<a th:href="@{/tasks/admin}" class="btn btn-outline-dark btn-sm fw-bold px-3 text-nowrap flex-grow-1">
					<i class="bi bi-people-fill me-1"></i>全ユーザーのタスク
				</a>

				<button class="btn btn-primary btn-sm fw-bold px-3 text-nowrap" data-bs-toggle="modal" data-bs-target="#addTaskModal">タスク追加</button>
			</div>
		</div>
		<!-- ================================================== -->

		<!-- 成功メッセージエリア -->
		<div th:if="${okMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i>
			<span th:text="${okMessage}">タスクが追加できたことを発表</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		
		<!-- ================= ソートボタン！ ================= -->
		<th:block th:replace="~{fragments/task_sort :: sortButton('/tasks')}"></th:block>
		<!-- ================= タブ切替ボタン ================= -->
		<ul id="taskTabList" class="nav nav-pills nav-fill mb-3 bg-light p-1 rounded border" role="tablist">
			<li class="nav-item">
				<button class="nav-link small fw-bold" data-status="TODO">
					未着手（<span th:text="${#lists.size(tasks.?[status == 'TODO'])}">0</span>）
				</button>
			</li>
			<li class="nav-item">
				<button class="nav-link small fw-bold" data-status="DOING">
					進行中（<span th:text="${#lists.size(tasks.?[status == 'DOING'])}">0</span>）
				</button>
			</li>
			<li class="nav-item">
				<button class="nav-link small fw-bold" data-status="DONE">
					完了済（<span th:text="${#lists.size(tasks.?[status == 'DONE'])}">0</span>）
				</button>
			</li>
			<li class="nav-item">
				<button class="active nav-link small fw-bold" data-status="all">
					すべて（<span th:text="${#lists.size(tasks)}">0</span>）
				</button>
			</li>
		</ul>
		<!-- ================================================== -->

		<!-- タブ中身（PC時は３列横並び表示） -->
		<div id="task-container" class="row g-4">
			
			<!-- 【未着手】セクション -->
			<div class="col-xl-4">
				<div class="task-section p-3 bg-light rounded shadow-sm border-top border-secondary border-4" data-section-status="TODO">
					<h5 class="fw-bold text-secondary mb-3">未着手</h5>
					<div th:classappend="${#lists.isEmpty(tasks.?[status == 'TODO']) ? '' : 'd-none'}" class="text-center text-muted my-4 empty-message">
						<p>未着手のタスクはありません</p>
					</div>
					
					<!-- ループ開始 「TODO」だけを「spCard」形式で表示-->
					<th:block th:each="task : ${tasks}" th:if="${task.status == 'TODO'}">
						<div th:replace="~{fragments/task_components :: spCard(${task})}"></div>
					</th:block>
				</div>
			</div>
			
			<!-- 【進行中】セクション -->
			<div class="col-xl-4">
				<div class="task-section p-3 bg-light rounded shadow-sm border-top border-primary border-4" data-section-status="DOING">
					<h5 class="fw-bold text-primary mb-3">進行中</h5>
					<div th:classappend="${#lists.isEmpty(tasks.?[status == 'DOING']) ? '' : 'd-none'}" class="text-center text-muted my-4 empty-message">
						<p>進行中のタスクはありません</p>
					</div>
					
					<!-- ループ開始 「DOING」だけを「spCard」形式で表示-->
					<th:block th:each="task : ${tasks}" th:if="${task.status == 'DOING'}">
						<div th:replace="~{fragments/task_components :: spCard(${task})}"></div>
					</th:block>
				</div>
			</div>
			
			<!-- 【完了済】セクション -->
			<div class="col-xl-4">
				<div class="task-section p-3 bg-light rounded shadow-sm border-top border-success border-4" data-section-status="DONE">
					<h5 class="fw-bold text-success mb-3">完了済</h5>
					<div th:classappend="${#lists.isEmpty(tasks.?[status == 'DONE']) ? '' : 'd-none'}" class="text-center text-muted my-4 empty-message">
						<p>完了済のタスクはありません</p>
					</div>
					
					<!-- ループ開始 「DONE」だけを「spCard」形式で表示-->
					<th:block th:each="task : ${tasks}" th:if="${task.status == 'DONE'}">
						<div th:replace="~{fragments/task_components :: spCard(${task})}"></div>
					</th:block>
				</div>
			</div>
			
		</div>
		
		
		
		<!-- ================= タスク登録モーダル ================= -->
		<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content shadow-lg">
					
					<div class="modal-header bg-light">
						<h5 class="modal-title fw-bold" id="addTaskModalLabel">
							<i class="bi bi-plus-circle-fill text-primary me-2"></i>新しいタスクを追加
						</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					
					<div class="modal-body p-4">
						<form th:action="@{/tasks/create}" th:object="${taskForm}" method="post">
							<div class="mb-3">
								<label for="title" class="form-label fw-bold text-secondary">タスク名</label>
								<input type="text" th:field="*{title}" class="form-control" required>
								<div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
							</div>
							<div class="mb-3">
								<label for="dueDate" class="form-label fw-bold text-secondary small">期限日</label>
								<input type="date" th:field="*{dueDate}" class="form-control">
							</div>
							<div class="mb-4">
								<label for="status" class="form-label fw-bold text-secondary">初期ステータス</label>
								<select th:field="*{status}" class="form-select">
									<option value="TODO">未着手</option>
									<option value="DOING">進行中</option>
									<option value="DONE">完了済</option>
								</select>
							</div>
							<div class="text-end">
								<button type="button" class="btn btn-outline-secondary fw-bold" data-bs-dismiss="modal">キャンセル</button>
								<button type="submit" class="btn btn-primary fw-bold px-4">登録する</button>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
		
	</main>
	<!--ブートストラップｊｓ-->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<!--非同期通信-->
	<script th:src="@{/js/task.js}"></script>
	<!--エラーで閉じちゃうタスク登録モーダルを開かせる-->
	<script th:if="${#fields.hasErrors('taskForm.*')}">
		const myModal = new bootstrap.Modal(document.getElementById('addTaskModal'));
		myModal.show();
	</script>
</body>
</html>
