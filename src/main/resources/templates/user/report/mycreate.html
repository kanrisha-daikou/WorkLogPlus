<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLogPlus reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	<div th:replace="~{fragments/layout :: navMenu}"></div>
	
	<main class="container py-4">
		
		<!-- ヘッダー -->
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 border-bottom pb-2">
			<h2 class="fw-bold text-secondary mb-0">
				<i class="bi bi-file-earmark-text-fill text-success me-2"></i>日報の新規作成
			</h2>
			<a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm">
				<i class="bi bi-arrow-left me-1"></i>日報一覧へ
			</a>
		</div>
		
		<!-- フォーム -->
		<form th:action="@{/reports/create}" th:object="${reportForm}" method="post" novalidate>
		
			<!-- 入力エラーが起きた時の赤い警告ボックス -->
			<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger shadow-sm mb-4 fw-bold" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>
				<span>入力内容にエラーがあります</span>
			</div>
		
			<div th:replace="~{fragments/report_form :: formCard}"></div>
			
			<!-- 下部の登録ボタン -->
			<div class="text-end mb-5">
				<button type="submit" class="btn btn-success btn-lg px-5 shadow">
					<i class="bi bi-cloud-arrow-up-fill me-2"></i>この内容で登録する
				</button>
			</div>
		</form>
		
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
