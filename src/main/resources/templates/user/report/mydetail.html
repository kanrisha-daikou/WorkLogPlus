<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLogPlus reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	<div th:replace="~{fragments/layout :: navMenu}"></div>
	
	<main class="container py-4">
	
		<!-- ヘッダー -->
		<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 border-bottom pb-2 gap-2">
			<h2 class="fw-bold text-secondary mb-0">
				<i class="bi bi-file-earmark-text text-primary me-2"></i>日報の詳細
			</h2>
			<a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm">
				<i class="bi bi-arrow-left me-1"></i>日報一覧へ
			</a>
		</div>
		
		<!-- 成功メッセージエリア -->
		<div th:if="${okMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i>
			<span th:text="${okMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		
		<!-- 日報の基本情報カード（日付） -->
		<div class="card shadow-sm">
			<div class="card-body px-4 d-flex flex-wrap justify-content-between align-items-center">
				<div class="d-flex flex-wrap align-items-center">
					<span class="small me-1">対象日：</span>
					<span class="fs-5 fw-bold text-primary" th:text="${reportDto.reportDate}">2026/07/24(金)</span>
				</div>
				
				<!-- 「編集する」ボタン -->
				<a th:href="@{/reports/{id}/edit(id=${reportDto.id})}" class="btn btn-warning btn-sm">
					<i class="bi bi-pencil-square me-1"></i>編集する
				</a>
			</div>
		</div>
		
		<!-- 日報詳細本文カード -->
		<div th:replace="~{fragments/report_detail :: detailCard}"></div>
		
		<!-- フィードバック -->
		<div th:if="${!#lists.isEmpty(comments)}" class="card border-warning shadow-sm">
			<div class="card-body p-4">
				<h5 class="fw-bold text-dark mb-4">
					<i class="bi bi-chat-left-dots-fill text-success me-2"></i>この日報へのフィードバック
				</h5>
				
				<!-- 過去のコメント履歴（チャット風） -->
				<div class="p-3 d-grid gap-3 bg-light rounded mb-4 border-start border-4 border-success shadow-sm">
					<div class="rounded bg-white p-2" th:each="comment : ${comments}">
						
						<div class="d-flex justify-content-between small text-muted mb-2">
							<span class="fw-bold me-2" th:text="${comment.adminName}">管理者名</span>
							<span th:text="${comment.createdAt}">2026/08/04 12:00</span>
						</div>
						<p class="m-0 small text-secondary" th:text="${comment.body}" style="white-space: pre-wrap;">前回のフィードバック内容がここに残ります。</p>
						
					</div>
				</div>
			
			</div>
		</div>
	
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
