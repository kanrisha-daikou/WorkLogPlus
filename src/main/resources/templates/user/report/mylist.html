<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLogPlus reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
	<div th:replace="~{fragments/layout :: navMenu}"></div>
	
	<main class="container py-4">
		
		<!-- ヘッダー -->
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 pb-2 border-bottom">
			<h2 class="fw-bold text-dark m-0"><i class="bi bi-file-earmark-text text-primary me-2"></i>日報管理(一覧)</h2>
			<a th:href="@{/reports/new}" class="btn btn-primary btn-sm fw-bold px-3">日報作成</a>
		</div>

		<!-- 成功メッセージエリア -->
		<div th:if="${okMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i>
			<span th:text="${okMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>

		<!-- 日報が1件もない場合の表示 -->
		<div th:if="${#lists.isEmpty(reports)}" class="text-center text-muted my-5 py-5 bg-white rounded border shadow-sm">
			<i class="bi bi-journal-x fs-1 text-black-50 mb-3 d-block"></i>
			<p class="m-0">提出された日報はありません</p>
		</div>

		<!-- 日報リスト -->
		<div th:if="${!#lists.isEmpty(reports)}" class="row row-cols-1 g-2">
			<div class="col" th:each="reportDto : ${reports}">
				<a th:href="@{/reports/{id}(id=${reportDto.id})}" 
				class="card shadow-sm list-group-item-action text-decoration-none d-block">
					<div class="card-body p-3 d-flex flex-column gap-2">
						
						<!-- 1行目：両端配置（日付 ---------------- フィードバックエリア） -->
						<div class="d-flex flex-wrap justify-content-between align-items-center">
							<!-- 日付 -->
							<span class="text-primary fw-bold small text-nowrap" th:text="${reportDto.reportDate}">2026/07/24(金)</span>
							
							<!-- コメントが1件以上ある場合のみフィードバックエリアを表示 -->
							<div th:if="${reportDto.commentCount > 0}" class="d-flex align-items-center text-nowrap ms-2">
								<span class="text-secondary small d-flex align-items-center">
									<i class="bi bi-chat-left-text-fill text-success me-1"></i>
									<span th:text="${reportDto.commentCount}">1</span>件
								</span>
								<span th:if="${reportDto.unRead}" class="badge bg-danger ms-2" style="font-size: 0.65rem; padding: 0.2em 0.5em;">未読あり</span>
							</div>
						</div>
						
						<!-- 2行目：本文のあらすじ -->
						<p class="card-text text-secondary small text-truncate m-0" th:text="${reportDto.content}">業務内容のあらすじがここに入ります。</p>
						
					</div>
				</a>
			</div>
		</div>

	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
