<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>500 Internal Server Error</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
	<div class="text-center p-5 bg-white rounded shadow-sm" style="max-width: 500px;">
	    <h1 class="text-danger fw-bold display-1"><i class="bi bi-exclamation-triangle-fill"></i></h1>
	    <h2 class="fw-bold text-dark mb-3 fs-3">システムエラーが発生しました</h2>
	    <p class="text-secondary small mb-4">
	        申し訳ありません。サーバー内部で予期せぬエラーが発生しました。<br>
	        時間を置いてからもう一度お試しください。
	    </p>
	    <a th:href="@{/}" class="btn btn-danger px-4 fw-bold shadow-sm">トップページへ戻る</a>
	</div>
</body>
</html>
