<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLogPlus dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
	<div class="container d-flex justify-content-center align-items-center min-vh-100">
		<div class="card shadow border-0 p-4" style="width: 100%; max-width: 400px;">
			
			<div class="text-center mb-4">
				<h1 class="h3 fw-bold text-dark">WorkLogPlus</h1>
				<p class="h3 fw-bold text-dark">ユーザー情報登録フォーム</p>
			</div>
			
			<form th:action="@{/register}" th:object="${userForm}" method="post">
				<div class="mb-3">
					<label for="username" class="form-label small fw-bold">ユーザー名</label>
					<input type="text" id="username" th:field="*{username}" class="form-control">
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
				</div>
				<div class="mb-3">
					<label for="email" class="form-label small fw-bold">メールアドレス</label>
					<input type="email" id="email" th:field="*{email}" class="form-control">
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
				</div>
				<div class="mb-4">
					<label for="password" class="form-label small fw-bold d-flex align-items-baseline gap-3">
						<span>パスワード</span>
						<span class="text-muted fw-normal" style="font-size: 0.7rem;">（※半角英数字を混ぜて８文字以上）</span>
					</label>
					<input type="password" id="password" th:field="*{password}" class="form-control">
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
				</div>
				<button type="submit" class="btn btn-primary mb-4">登録する</button>
			</form>
			
			<div class="text-center border-top pt-4">
				<p class="small mb-1">すでにアカウントをお持ちの方はこちらから</p>
				<a th:href="@{/login}" class="btn btn-outline-secondary btn-sm">ログイン画面へ</a>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
