spring.application.name=WorkLogPlus
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?serverTimezone=Asia/Tokyo&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

#MySQL Driverを追加しているので↓は要らない
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#自動でテーブルを更新させる
spring.jpa.hibernate.ddl-auto=update

#SQL文をコンソールに表示
spring.jpa.show-sql=true
#その表示を改行などして縦に見やすく並べる
spring.jpa.properties.hibernate.format_sql=true
#SQLの？の値を表示
logging.level.org.hibernate.orm.jdbc.bind=trace



# 1. ログイン成功・失敗のログだけをピンポイントで出す
logging.level.org.springframework.security=DEBUG
# 2. ログアウト（セッション破棄）のログだけをピンポイントで出す
logging.level.org.springframework.security.web.authentication.logout=DEBUG
# 3. ログイン画面への強制移動などのログだけを出す
logging.level.org.springframework.security.web.access=DEBUG